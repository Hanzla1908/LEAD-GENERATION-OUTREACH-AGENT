# CI for pull requests into main and for pushes to main.
#
# No real credentials are used. Every job runs with Demo Mode and Mock Email Mode, and tests stub Google Places,
# the AI provider and every mail server. A job fails the pull request when its tests or build fail.
# The job ids below are the names to select as required status checks in branch protection (see docs/GITHUB_AND_VERCEL.md).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No .env file is tracked (placeholder and test-config files are allowed)
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '\.env\.(example|test)$'; then
            echo "A real .env file is tracked. Remove it from Git and rotate any secret it held."
            exit 1
          fi
      - name: No key-shaped secrets in tracked files
        run: |
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo "A key-shaped secret is present in a tracked file. Remove it and rotate the key."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEMO_MODE: "true"
      MOCK_EMAIL_MODE: "true"
      EMAIL_PROVIDER: mock
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q
      - name: Dependency audit (advisory)
        working-directory: backend
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit and integration tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, mocked backend)
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  email-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: email-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: email-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests (node --test)
        run: npm test
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
