# Render Blueprint for the Restaurant Outreach System.
#
# Creates four resources:
#   ro-db        PostgreSQL database
#   ro-backend   FastAPI web service (public, behind login)
#   ro-email     Node.js Nodemailer service (private: reachable only inside Render's network)
#   ro-frontend  React static site
#
# No secret values are stored in this file. Entries marked `sync: false` are entered in the
# Render dashboard. Entries marked `generateValue: true` are generated by Render.
#
# DEMO_MODE and MOCK_EMAIL_MODE stay on, so the deployment needs no Google, SMTP or other
# live credentials and never sends real email. See docs/DEPLOYMENT.md for the order of steps.

databases:
  - name: ro-db
    databaseName: ro_outreach
    user: ro_outreach
    plan: basic-256mb

services:
  - type: web
    name: ro-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ro-db
          property: connectionString
      # No shared admin password. The first admin account is created with scripts/create_admin.py.
      - key: SESSION_SECRET
        generateValue: true
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Set to the ro-frontend URL, for example https://ro-frontend.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false # Set to this backend's URL, for example https://ro-backend.onrender.com
      - key: DEMO_MODE
        value: "true"
      - key: MOCK_EMAIL_MODE
        value: "true"
      - key: EMAIL_PROVIDER
        value: mock
      - key: EMAIL_SERVICE_URL
        fromService:
          type: pserv
          name: ro-email
          property: hostport
      - key: EMAIL_SERVICE_SECRET
        fromService:
          type: pserv
          name: ro-email
          envVarKey: EMAIL_SERVICE_SECRET
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true" # Render's proxy sets X-Forwarded-For; the login throttle uses the rightmost hop.
      - key: MAX_REQUEST_BYTES
        value: "65536"
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO

  - type: pserv
    name: ro-email
    runtime: node
    rootDir: email-service
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /livez
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: MAIL_MODE
        value: mock
      - key: EMAIL_SERVICE_HOST
        value: 0.0.0.0
      - key: EMAIL_SERVICE_PORT
        value: "10000"
      - key: EMAIL_SERVICE_SECRET
        generateValue: true

  - type: web
    name: ro-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: VITE_API_ORIGIN
        sync: false # Set to the ro-backend URL, for example https://ro-backend.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
